<!DOCTYPE html>

<html>

<head>
	<title>Python Calculator</title>
	
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
	<div class="calculator">
		<h1>Calculator</h1>
		<form method="POST">
			<input type="number" step="any" name="first_number" placeholder="First number" required >
			<input type="number" step="any" name="second_number" placeholder="Second number" required >
			
			<div class="buttons">
				<button type="submit" name="operation" value="+">+</button>
				<button type="submit" name="operation" value="-">-</button>
				<button type="submit" name="operation" value="*">*</button>
				<button type="submit" name="operation" value="/">/</button>
			</div>
		</form>
		
		{% if result is not none %}
		
			<h2>
				Result: {{ result }}
			</h2>
			
		{% endif %}
	</div>
</body>
</html>
