<html>

<head>

	<link rel="stylesheet" href="{{ url_for('static', filename='guestbook.css') }}">

    <title>Guestbook</title>
</head>

<body>

	{% with messages = get_flashed_messages() %}

		{% if messages %}

			{% for message in messages %}
				<p>{{ message }}</p>
			{% endfor %}

		{% endif %}

	{% endwith %}

    <h1>Guestbook</h1>

		<form method="POST">

			<label>Name:</label>
			<input type="text" name="name" maxlength='50' required>

			<br><br>

			<label>Comment:</label>
			<textarea name="comment" maxlength='500' required></textarea>

			<br><br>

			<button type="submit">Sign Guestbook</button>

		</form>

		<hr>


    {% for entry in entries %}

        <div class="entry">
            <h3>{{ entry[0] }}</h3>

            <p>
                {{ entry[1] }}
            </p>

            <small>
                {{ entry[2] }}
            </small>
        </div>

        <hr>

    {% endfor %}

</body>

</html>
